<svg class="SNQ-2001" fill="none" viewBox="0 0 675 75" width="675" height="75" xmlns="http://www.w3.org/2000/svg" style="border-radius: 5px;">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        @keyframes typing {
          0%   { width: 0 }
          65%  { width: 19.2ch }   /* texto completamente escrito */
          100% { width: 19.2ch }   /* se mantiene visible mientras parpadea */
        }

        @keyframes blink-caret {
          50% { border-color: transparent }
        }

        .container {
          width: 100%;
          height: 100%;
          background: #000000;
          border-radius: 5px;
        }

        h1 {
          font: bold 300% Consolas, Monaco, monospace;
          color: #26e10b;
          text-shadow: #26e10b 0px 0 5px;
          border-right: .2em solid #26e10b;
          margin: 0.05em 1.15em;
          padding-top: 4px;
          white-space: nowrap;
          overflow: hidden;
          width: 0;

          /* 
             Duración total: 4.5s
             - Escribir (2.5s)
             - Parpadeo (4 ciclos x 0.5s)
             - Reinicia
          */
          animation: typing 4.5s steps(21, end) infinite,
                     blink-caret .5s step-end infinite;
        }
      </style>
      <div class="container">
        <h1>Welcome to SNQ-2001</h1>
      </div>
    </div>
  </foreignObject>
</svg>
